# Builds the site in GitHub's cloud (no local Node.js needed) and publishes
# the static export to GitHub Pages on every push to `main`.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # GitHub Pages project sites live at /<repo-name>/, so Next.js needs the
      # repo name as basePath. GITHUB_REPOSITORY is "owner/repo".
      - name: Build static export
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}" npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
