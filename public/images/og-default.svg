<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1F2A"/>
      <stop offset="100%" stop-color="#004E89"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#F7B84D"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#F9FAFB" stroke-width="0.5">
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="63" x2="1200" y2="63"/>
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="189" x2="1200" y2="189"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="441" x2="1200" y2="441"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="0" y1="567" x2="1200" y2="567"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
  </g>

  <!-- Bridge logo mark -->
  <g transform="translate(100, 200)">
    <!-- Bridge arch -->
    <path d="M0 160 Q150 20 300 160" stroke="#F9FAFB" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Bridge supports -->
    <line x1="40" y1="160" x2="40" y2="100" stroke="#F9FAFB" stroke-width="5" stroke-linecap="round"/>
    <line x1="260" y1="160" x2="260" y2="100" stroke="#F9FAFB" stroke-width="5" stroke-linecap="round"/>
    <!-- Route line (gold) -->
    <path d="M0 160 Q150 70 300 160" stroke="url(#bridge)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="8 12"/>
  </g>

  <!-- BRB text -->
  <text x="100" y="440" fill="#F9FAFB" font-family="sans-serif" font-weight="800" font-size="90" letter-spacing="8">BRB</text>
  
  <!-- Enterprise text -->
  <text x="100" y="475" fill="#C0C5CE" font-family="sans-serif" font-weight="400" font-size="22" letter-spacing="12" text-transform="uppercase">ENTERPRISE</text>

  <!-- Tagline -->
  <text x="100" y="530" fill="#9BA2AE" font-family="sans-serif" font-weight="300" font-size="24">Bridging Routes, Building Reach</text>

  <!-- Gold accent line -->
  <rect x="100" y="500" width="200" height="3" fill="url(#bridge)" rx="1.5"/>
  
  <!-- Right side decorative circles -->
  <circle cx="950" cy="280" r="60" fill="none" stroke="#1E81B0" stroke-width="1.5" opacity="0.3"/>
  <circle cx="950" cy="280" r="100" fill="none" stroke="#1E81B0" stroke-width="1" opacity="0.15"/>
  <circle cx="950" cy="280" r="140" fill="none" stroke="#1E81B0" stroke-width="0.5" opacity="0.1"/>
  
  <!-- Small route dots -->
  <circle cx="880" cy="200" r="4" fill="#F5A623" opacity="0.6"/>
  <circle cx="1020" cy="240" r="3" fill="#F5A623" opacity="0.4"/>
  <circle cx="980" cy="350" r="3.5" fill="#1E81B0" opacity="0.5"/>
  <circle cx="860" cy="320" r="2.5" fill="#1E81B0" opacity="0.3"/>
</svg>