  <line x1="48" y1="48" x2="48" y2="34" stroke="#F9FAFB" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Route line (gold accent) -->
  <path d="M10 48 Q32 24 54 48" stroke="url(#route)" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4 5"/>
</svg>